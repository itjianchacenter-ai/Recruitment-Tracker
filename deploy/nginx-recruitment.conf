# =====================================================================
# nginx site config — recruitment.jchr-global.com
# วางไฟล์นี้ที่: /etc/nginx/sites-available/recruitment.jchr-global.com
# แล้ว: sudo ln -s /etc/nginx/sites-available/recruitment.jchr-global.com /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
# TLS: ใช้ Cloudflare Origin Certificate (แนะนำ) — ดู DEPLOY_DIGITALOCEAN.md ขั้นที่ 6
#      หรือ Let's Encrypt (certbot จะเติม ssl_certificate ให้อัตโนมัติ)
# =====================================================================

# ---- HTTP (80) : ใช้ตอนขอ cert + redirect ไป HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name recruitment.jchr-global.com;

    # สำหรับ Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS (443) : เสิร์ฟ frontend (Vite build = static SPA) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name recruitment.jchr-global.com;

    # --- TLS cert ---
    # ตัวเลือก 1 (แนะนำ): Cloudflare Origin Certificate
    ssl_certificate     /etc/ssl/cloudflare/recruitment.pem;
    ssl_certificate_key /etc/ssl/cloudflare/recruitment.key;
    # ตัวเลือก 2: Let's Encrypt (ถ้าใช้ certbot ให้คอมเมนต์ 2 บรรทัดบน แล้ว certbot จะเติมให้)
    # ssl_certificate     /etc/letsencrypt/live/recruitment.jchr-global.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/recruitment.jchr-global.com/privkey.pem;

    root /var/www/recruitment/dist;
    index index.html;

    # ----- Security headers -----
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ----- SPA: ทุก path ที่ไม่ใช่ไฟล์จริง → index.html -----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----- cache asset ที่มี hash -----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ----- (ทางเลือก) จำกัดเฉพาะ IP ออฟฟิศ ก่อนทำ login เสร็จ -----
    # ปลดคอมเมนต์ + ใส่ IP ออฟฟิศ เพื่อกันคนนอกระหว่างที่ RLS/login ยังไม่พร้อม
    # allow 203.0.113.0/24;   # <-- เปลี่ยนเป็นช่วง IP ออฟฟิศจริง
    # deny  all;
}
